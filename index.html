<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои заметки</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        h1 { color: #ffd700; }
        input { padding: 10px; font-size: 16px; width: 60%; border-radius: 8px; border: none; }
        button { padding: 10px 15px; font-size: 16px; background: #ffd700; border: none; border-radius: 8px; cursor: pointer; }
        li { background: #16213e; margin: 10px 0; padding: 10px; border-radius: 8px; list-style: none; }
        .del { background: #e94560; color: white; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>📝 Мои заметки</h1>
    <input id="text" placeholder="Напиши заметку...">
    <button onclick="add()">Добавить</button>
    <ul id="list"></ul>

    <script>
        let notes = [];

        function add() {
            let text = document.getElementById("text").value;
            if (text === "") return;
            notes.push(text);
            document.getElementById("text").value = "";
            show();
        }

        function show() {
            let list = document.getElementById("list");
            list.innerHTML = "";
            for (let i = 0; i < notes.length; i++) {
                list.innerHTML += "<li>" + notes[i] + 
                    "<button class='del' onclick='del(" + i + ")'>❌</button></li>";
            }
        }

        function del(i) {
            notes.splice(i, 1);
            show();
        }
    </script>
</body>
</html>
